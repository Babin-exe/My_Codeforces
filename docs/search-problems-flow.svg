<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1120" role="img" aria-labelledby="title desc">
  <title id="title">Search problems mental model</title>
  <desc id="desc">The problems table joins to its active problem version, then public scope, difficulty range, and title-or-slug text conditions are combined before counting, sorting, pagination, and returning safe summary fields.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#82aaff"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #eef3ff; }
      .title { font-size: 38px; font-weight: 700; }
      .subtitle { font-size: 19px; fill: #aab8d0; }
      .label { font-size: 18px; font-weight: 700; }
      .body { font-size: 17px; fill: #d4def0; }
      .small { font-size: 15px; fill: #aab8d0; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 17px; fill: #e5edff; }
      .panel { fill: #111b2e; stroke: #293955; stroke-width: 2; }
      .accent { fill: #142640; stroke: #4474aa; stroke-width: 2; }
      .soft { fill: #16243a; stroke: #314766; stroke-width: 2; }
      .line { stroke: #82aaff; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .divider { stroke: #293955; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1440" height="1120" rx="28" fill="#0b1220"/>
  <text class="title" x="64" y="78">Search problems: the mental model</text>
  <text class="subtitle" x="64" y="116">Scope → Join → Filter → Search → Count → Order → Page → Respond</text>

  <text class="label" x="64" y="174">1 · Know where each field lives</text>
  <rect class="panel" x="64" y="198" width="530" height="198" rx="18"/>
  <text class="label" x="94" y="238">problems · one stable row per problem</text>
  <text class="mono" x="94" y="279">id · slug</text>
  <text class="mono" x="94" y="311">status · visibility · deletedAt</text>
  <text class="small" x="94" y="360">Identity and whether the problem is public</text>

  <path class="line" d="M615 298 H811"/>
  <text class="small" x="642" y="272">JOIN ON</text>
  <text class="mono" x="622" y="333">id = problemId</text>

  <rect class="panel" x="846" y="198" width="530" height="198" rx="18"/>
  <text class="label" x="876" y="238">problem_versions · one row per revision</text>
  <text class="mono" x="876" y="279">id · problemId</text>
  <text class="mono" x="876" y="311">title · difficulty · isActive</text>
  <text class="small" x="876" y="360">Text, rating, and the active revision</text>

  <text class="label" x="64" y="452">2 · Combine conditions with the right logic</text>
  <rect class="soft" x="64" y="478" width="392" height="220" rx="18"/>
  <text class="label" x="92" y="520">BASE SCOPE</text>
  <text class="body" x="92" y="559">published AND visible</text>
  <text class="body" x="92" y="590">AND not deleted</text>
  <text class="body" x="92" y="621">AND active version</text>
  <text class="small" x="92" y="666">Required for public results</text>

  <text class="label" x="484" y="596" font-size="30">AND</text>

  <rect class="soft" x="564" y="478" width="340" height="220" rx="18"/>
  <text class="label" x="592" y="520">DIFFICULTY RANGE</text>
  <text class="mono" x="592" y="573">minRating ≤</text>
  <text class="mono" x="592" y="606">difficulty ≤ maxRating</text>
  <text class="small" x="592" y="666">Two simple numeric checks</text>

  <text class="label" x="930" y="596" font-size="30">AND</text>

  <rect class="soft" x="1010" y="478" width="366" height="220" rx="18"/>
  <text class="label" x="1038" y="520">TEXT (IF PROVIDED)</text>
  <text class="body" x="1038" y="566">title matches q</text>
  <text class="label" x="1038" y="600">OR</text>
  <text class="body" x="1080" y="600">slug matches q</text>
  <text class="small" x="1038" y="666">One query, two candidate fields</text>

  <rect class="accent" x="64" y="726" width="1312" height="104" rx="18"/>
  <text class="label" x="94" y="769">Start simple:</text>
  <text class="body" x="222" y="769">trim q, then substring-search title and slug. Spaces may become hyphens for slug matching.</text>
  <text class="small" x="94" y="804">Do not split into tokens or search the full statement until you want those behaviors.</text>

  <text class="label" x="64" y="886">3 · Finish the result set in order</text>
  <rect class="panel" x="64" y="910" width="288" height="142" rx="18"/>
  <text class="label" x="88" y="949">COUNT</text>
  <text class="body" x="88" y="983">Same join + filters</text>
  <text class="small" x="88" y="1020">Before the page window</text>

  <path class="line" d="M366 980 H418"/>
  <rect class="panel" x="438" y="910" width="288" height="142" rx="18"/>
  <text class="label" x="462" y="949">ORDER</text>
  <text class="body" x="462" y="983">Stable sort + ID tie-break</text>
  <text class="small" x="462" y="1020">Same results, predictable pages</text>

  <path class="line" d="M740 980 H792"/>
  <rect class="panel" x="812" y="910" width="288" height="142" rx="18"/>
  <text class="label" x="836" y="949">PAGE</text>
  <text class="mono" x="836" y="983">offset=(page-1)×size</text>
  <text class="small" x="836" y="1020">limit(pageSize), cap the size</text>

  <path class="line" d="M1114 980 H1166"/>
  <rect class="panel" x="1186" y="910" width="190" height="142" rx="18"/>
  <text class="label" x="1210" y="949">RESPOND</text>
  <text class="body" x="1210" y="983">summary rows</text>
  <text class="small" x="1210" y="1020">+ pagination</text>

  <text class="small" x="64" y="1090">Keep only one active version per problem; otherwise the join can produce duplicate cards.</text>
</svg>
